[project]
name = "whatsapp-expense-bot"
version = "0.1.0"
description = "A smart WhatsApp budget and expense tracking bot powered by OpenAI structured outputs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-dotenv>=1.2.2",
    "supabase>=2.31.0",
    "requests>=2.34.2",
    "apscheduler>=3.11.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
